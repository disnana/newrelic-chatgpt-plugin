name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/read-version.py
      - run: npm run build
      - run: node scripts/validate-artifact.mjs
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - run: python3 scripts/test-migrations.py
      - run: python3 -m unittest discover -s ops/scylla-gate -p 'test_*.py' -v
      - run: bash -n ops/scylla-gate/install.sh
      - run: sha256sum ops/scylla-gate/gate.py
      - run: python3 scripts/check-distribution.py
      - run: python3 scripts/package-release.py
