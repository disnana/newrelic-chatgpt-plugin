name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/read-version.py
      - run: npm run build
      - run: node scripts/validate-artifact.mjs
      - run: node scripts/test-mcp.mjs
      - run: python3 scripts/test-migrations.py
      - run: python3 scripts/check-distribution.py
      - run: python3 scripts/package-release.py
